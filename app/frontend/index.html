<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agentic GraphRAG over 7,000+ bioRxiv genomics preprints: hybrid retrieval, a biomedical entity graph, and cited answers you can inspect step by step." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7490'/%3E%3Cpath d='M11 7c0 6 10 6 10 12s-10 6-10 6M21 7c0 6-10 6-10 12s10 6 10 6M12 11h8M12 21h8' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta property="og:title" content="GenomicIR" />
    <meta property="og:description" content="Ask questions of 7,000+ bioRxiv genomics preprints. An LLM agent searches, walks an entity graph, and cites its sources." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GenomicIR" />
    <meta name="twitter:description" content="Agentic GraphRAG over 7,000+ bioRxiv genomics preprints." />
    <title>GenomicIR</title>
    <!-- Prevent flash of unstyled theme: apply saved preferences before first paint -->
    <script>
      (function() {
        try {
          var html = document.documentElement;
          var t = localStorage.getItem('genomic-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          html.classList.remove('dark', 'light');
          html.classList.add(t);
          var hc = localStorage.getItem('genomic-hc') === '1'
            || window.matchMedia('(prefers-contrast: more)').matches;
          if (hc) html.classList.add('hc');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
