name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.9.4
      - name: Lint
        run: ruff check .
        working-directory: app/backend

  backend-test:
    name: Backend · pytest (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Core tests exercise data loading and the knowledge-graph algorithms
      # without the heavy ML model downloads (FAISS / sentence-transformers /
      # scispaCy). Run the full suite locally with `make test`.
      - name: Install core dependencies
        run: pip install pandas pydantic python-dotenv networkx pytest pytest-asyncio
      - name: Run core tests
        run: pytest tests/test_data_store.py tests/test_graph.py -q
        working-directory: app/backend

  frontend:
    name: Frontend · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app/frontend
      - name: Lint
        run: npm run lint
        working-directory: app/frontend
      - name: Test
        run: npm run test
        working-directory: app/frontend
      - name: Build
        run: npm run build
        working-directory: app/frontend
