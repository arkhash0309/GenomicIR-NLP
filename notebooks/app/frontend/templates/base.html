<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}GenomicIR · NLP for Genomics Literature{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-{{ active }}">
  <div class="bg-helix" aria-hidden="true">
    <canvas id="helixCanvas"></canvas>
  </div>

  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#5eead4"/>
              <stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
          </defs>
          <path d="M6 4 C 22 12, 10 20, 26 28 M26 4 C 10 12, 22 20, 6 28"
                stroke="url(#g1)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <circle cx="11" cy="9" r="1.5" fill="#5eead4"/>
          <circle cx="21" cy="9" r="1.5" fill="#818cf8"/>
          <circle cx="13" cy="16" r="1.5" fill="#5eead4"/>
          <circle cx="19" cy="16" r="1.5" fill="#818cf8"/>
          <circle cx="11" cy="23" r="1.5" fill="#5eead4"/>
          <circle cx="21" cy="23" r="1.5" fill="#818cf8"/>
        </svg>
      </span>
      <span class="brand-text">GenomicIR<span class="brand-accent">·</span>NLP</span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('home') }}" class="{% if active=='home' %}active{% endif %}">Home</a>
      <a href="{{ url_for('retrieve_page') }}" class="{% if active=='retrieve' %}active{% endif %}">Retrieve</a>
      <a href="{{ url_for('summarize_page') }}" class="{% if active=='summarize' %}active{% endif %}">Summarize</a>
      <a href="{{ url_for('qa_page') }}" class="{% if active=='qa' %}active{% endif %}">Ask</a>
      <a href="{{ url_for('about_page') }}" class="{% if active=='about' %}active{% endif %}">About</a>
    </nav>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>GenomicIR-NLP · powered by Flask &amp; Fastify</span>
    <span class="footer-dot">●</span>
    <span class="mono">data: bioRxiv genomics collection</span>
  </footer>

  <script>
    window.BACKEND_URL = "{{ backend_url }}";
  </script>
  <script src="{{ url_for('static', filename='js/helix.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
